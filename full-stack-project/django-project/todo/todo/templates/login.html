{% load static  %}
<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device_width , initial_scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}">

</head>
<body>
    <div class="signup_body">
        <div class="signup_box">
            <form method="post">
                {% csrf_token %}
                <div class="heading">
                    Log in
                </div>
<div class="line"></div>
<div class="field">
    <b>Username<b>
    <input type="text" class="inp" required placeholder="Enter your name" name="fnm">

</div>
<div class="field">
    <b>Password</b>
    <input type="password" class="inp" required name="pwd">
</div>
<div class="field">
    <input type="submit" name="submit_button" value="Log in">
</div>
<div class="field">
    <b>Dont have an account?</b>
    <br>
    <a class="anc" href=" ">Click here to sign in </a>
</div>
            </form>
        </div>
    </div>
</body>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device_width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="hello">
        <h1>Hello, {{ user.username }}</h1>
    </div>
    
    <div class="signup_body">
        <div class="signup_box">
            <div class="heading">
                Get Things Done?
            </div>
            
            <form method="post">
                {% csrf_token %}

                <input type="text" required class="inp" placeholder="Enter Today's task" name='task'>
                <br><br>
                <div class="date-group">
                    <label for="expected_date" class="date-label">Your expect to finish at:</label>
                    <input type="date" id="expected_date" name="expected_date" required class="date-inp"> 
                </div>
                <input type="submit" class="submit-button" value="Add task">
            </form>

            <div class="todo-list-container">
                <br><br>
                {% for a in res %}
                <div class="todo">
                    <div class="todo-info">
                        <span class="todo-title"><strong>{{ a.title }}</strong></span>
                        <span class="todo-meta">Created: {{ a.date|date:"H:i" }}</span> 
                        <span class="todo-expected">Expected: {{ a.expected_date }}</span>
                    </div>
                    
                    <div class="todo-actions">
                        <a href="{% url 'edit_todo' a.num %}" class="action-btn">
                            <img src="{% static 'edit.png' %}" alt="Edit" width="16">
                        </a>
                        
                        <a href="/delete/{{a.num}}" class="action-btn" onclick="return confirm('Are you sure you want to delete this task?');">
                            <img src="{% static 'del.png' %}" alt="Delete" width="16">
                        </a>
                    </div>
                </div>
                {% empty %}
                <div class="empty-todo">No tasks found. Add a task to get started!</div>
                {% endfor %}
                
                <div style="margin-top: 15px; text-align: left;">
                    <a href="/logout/" class="action-btn" title="Logout">
                        <img src="{% static 'exit.png' %}" alt="quit" width="16"> Logout
                    </a>
                </div>
            </div> </div> </div> </body>
</html>
